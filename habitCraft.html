<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>주간 도전</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafafa;--card:#fff;--tx:#18181b;--mut:#71717a;--pri:#4338ca;--ln:#e4e4e7;--ok:#16a34a;--gold:#18181b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--card:#17171c;--tx:#f4f4f5;--mut:#a1a1aa;--pri:#6366f1;--ln:#2a2a31;--ok:#4ade80;--gold:#f4f4f5}}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#17171c;--tx:#f4f4f5;--mut:#a1a1aa;--pri:#6366f1;--ln:#2a2a31;--ok:#4ade80;--gold:#f4f4f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
.pts{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right}.pts small{font-size:12px;color:var(--mut);font-weight:500}
.lv{font-size:12px;color:var(--mut)}
nav{display:flex;gap:22px;margin:12px 0 16px;border-bottom:1px solid var(--ln)}
nav button{padding:8px 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mut);font-size:15px;font-weight:600;margin-bottom:-1px}
nav button.on{color:var(--tx);border-bottom-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:8px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk button,.sm{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;font-size:13px}
.bar{height:4px;background:var(--ln);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.mut{color:var(--mut);font-size:13px}
.day.today{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.day h3{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.t{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.t .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--mut);background:transparent;color:#fff;font-size:13px;flex:none;padding:0}
.t.done .ck{background:var(--pri);border-color:var(--pri)}
.t.done .tx{text-decoration:line-through;color:var(--mut)}
.t .tx{flex:1;word-break:break-all}
.t .x{border:0;background:none;color:var(--mut);font-size:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;margin:4px 0}
.pri{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600}
.pri:disabled{opacity:.4}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pick button{width:38px;height:38px;border-radius:10px;border:2px solid var(--ln);background:var(--card);font-size:20px}
.pick button.on{outline:2px solid var(--tx);outline-offset:2px}
.dot{width:26px!important;height:26px!important;border-radius:50%!important;border:0!important}
.empty{text-align:center;padding:24px 8px;color:var(--mut)}
.pop{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;z-index:9;animation:up 1.8s forwards;text-align:center;white-space:nowrap}
.install{display:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600}
@media (max-width:380px){.wrap{padding-left:10px;padding-right:10px}.install{padding:6px 7px}h1{font-size:18px}.pts{font-size:21px}}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const KEY="weekly-challenge-v1",EM=["📚","🔢","✏️","🌍","🔬","🎹","⚽","🇬🇧"],CO=["#5b6cff","#e0568b","#1fa36a","#e58a1f","#8a5bd6","#1f9bd1"],LV=["새싹","도전자","탐험가","용사","챔피언","마스터"],DN=["월","화","수","목","금","토","일"];
let S={goals:[],tasks:[],rewards:[],spent:0,got:[]},tab="week",off=0,adding=null,newG={e:EM[0],c:CO[0]};
let dbPromise,sync="local";
function openStore(){return dbPromise||(dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open("habitCraft",2);r.onupgradeneeded=ev=>{const db=ev.target.result;if(!db.objectStoreNames.contains("state"))db.createObjectStore("state")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}))}
async function readState(){
 try{
  const db=await openStore(),value=await new Promise((resolve,reject)=>{const r=db.transaction("state").objectStore("state").get(KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
  if(value)return Object.assign(S,value);
  const old=localStorage.getItem(KEY);
  if(old){S=Object.assign(S,JSON.parse(old));await writeState();localStorage.removeItem(KEY)}
 }catch(e){sync="memory"}
 return S;
}
async function writeState(){
 S.at=Date.now();
 try{const db=await openStore();await new Promise((resolve,reject)=>{const r=db.transaction("state","readwrite").objectStore("state").put(S,KEY);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
 catch(e){sync="memory"}
}
function save(){writeState()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const mon=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const wdates=o=>{const m=mon(new Date());m.setDate(m.getDate()+o*7);return[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return ds(d)})};
const gid=id=>S.goals.find(g=>g.id===id);
function bonus(){const w={};S.tasks.forEach(t=>{const k=ds(mon(new Date(t.date+"T12:00")));(w[k]=w[k]||[]).push(t)});let b=0;Object.values(w).forEach(a=>{if(a.length>=3&&a.filter(t=>t.done).length/a.length>=.8)b+=30});return b}
const earned=()=>S.tasks.filter(t=>t.done).length*10+bonus();
const bal=()=>earned()-S.spent;
function pop(m){const d=document.createElement("div");d.className="pop";d.innerHTML=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function render(){
 const e=earned(),lv=Math.min(Math.floor(e/100),LV.length-1);
 let h=`<header><div><h1>주간 도전</h1><div class="lv">Lv.${lv+1} ${LV[lv]} · 다음 레벨까지 ${lv>=LV.length-1?"MAX":100*(lv+1)-e+"점"}</div></div><div class="row"><button class="install" id="install">앱 설치</button><div class="pts">${bal()}<small> pt</small></div></div></header>`;
 h+=`<nav>${[["week","이번 주"],["goal","목표"],["rew","보상"],["bak","백업"]].map(([k,n])=>`<button class="${tab===k?"on":""}" data-a="tab" data-v="${k}">${n}</button>`).join("")}</nav>`;
 h+=tab==="week"?vWeek():tab==="goal"?vGoal():tab==="rew"?vRew():vBak();
 document.getElementById("app").innerHTML=h;
}
function vWeek(){
 const ds7=wdates(off),all=S.tasks.filter(t=>ds7.includes(t.date)),dn=all.filter(t=>t.done).length,pc=all.length?Math.round(dn/all.length*100):0,today=ds(new Date());
 if(!S.goals.length)return`<div class="card empty">먼저 <b>내 목표</b>를 만들어 볼까요?<br>하고 싶은 목표가 있어야 계획을 세울 수 있어요.<br><br><button class="pri" data-a="tab" data-v="goal">목표 만들러 가기</button></div>`;
 let h=`<div class="card"><div class="wk"><button data-a="wk" data-v="-1">◀</button><b>${ds7[0].slice(5).replace("-","/")} ~ ${ds7[6].slice(5).replace("-","/")}${off===0?" (이번 주)":""}</b><button data-a="wk" data-v="1">▶</button></div><div class="bar"><i style="width:${pc}%"></i></div><div class="mut">${all.length?`${all.length}개 중 ${dn}개 완료 (${pc}%) · 80% 이상이면 보너스 30pt`:"계획을 세워 보세요. 3개 이상 세우고 80%를 달성하면 보너스!"}</div></div>`;
 ds7.forEach((d,i)=>{
  const ts=S.tasks.filter(t=>t.date===d);
  h+=`<div class="card day ${d===today?"today":""}"><h3><span>${DN[i]}요일 <span class="mut">${d.slice(5).replace("-","/")}</span></span><button class="sm" data-a="add" data-v="${d}">+ 추가</button></h3>`;
  ts.forEach(t=>{const g=gid(t.g)||{e:"•",c:"#888",n:"(삭제된 목표)"};h+=`<div class="t ${t.done?"done":""}"><button class="ck" data-a="chk" data-v="${t.id}">${t.done?"✓":""}</button><div class="tx">${esc(t.x)}<br><span class="chip" style="--cc:${g.c}">${esc(g.n)}</span></div><button class="x" data-a="del" data-v="${t.id}">✕</button></div>`});
  if(!ts.length&&adding!==d)h+=`<div class="mut">아직 계획이 없어요</div>`;
  if(adding===d)h+=`<div class="t" style="display:block"><select id="ag">${S.goals.map(g=>`<option value="${g.id}">${esc(g.n)}</option>`).join("")}</select><input id="at" maxlength="40" placeholder="무엇을 할까요? 예) 수학 문제집 3쪽"><div class="row"><button class="pri" data-a="save" data-v="${d}">추가</button><button class="sm" data-a="add" data-v="">취소</button></div></div>`;
  h+=`</div>`});
 return h}
function vGoal(){
 let h=`<div class="card"><b>새 목표 만들기</b><div class="mut">내가 이루고 싶은 것을 직접 정해요</div><input id="gn" maxlength="20" placeholder="예) 수학 실력 올리기"><div class="row pick" style="margin:8px 0">${CO.map(c=>`<button class="dot ${newG.c===c?"on":""}" style="background:${c}" data-a="gc" data-v="${c}"></button>`).join("")}</div><button class="pri" data-a="gadd">목표 추가</button></div>`;
 const w=wdates(0);
 S.goals.forEach(g=>{const a=S.tasks.filter(t=>t.g===g.id&&w.includes(t.date));h+=`<div class="card row" style="justify-content:space-between"><div><span class="chip" style="--cc:${g.c};color:var(--tx);font-size:15px;font-weight:600">${esc(g.n)}</span><div class="mut">이번 주 ${a.filter(t=>t.done).length}/${a.length} 완료</div></div><button class="sm" data-a="gdel" data-v="${g.id}">삭제</button></div>`});
 return h}
function vBak(){return`<div class="card"><b>이 기기에 저장</b><div class="mut">${sync==="memory"?"브라우저 저장소를 사용할 수 없어 임시로만 저장 중이에요.":"IndexedDB에 저장 중 · 인터넷 없이도 사용할 수 있어요."}</div></div><div class="card"><b>파일로 백업</b><div class="mut">기록을 파일로 저장해 두었다가 다른 기기나 새 브라우저에서 불러올 수 있어요. 불러오면 지금 기록이 파일 내용으로 바뀌어요.</div><div class="row" style="margin-top:8px"><button class="pri" data-a="exp">파일로 저장</button><button class="sm" data-a="imp">파일 불러오기</button></div><input type="file" id="fi" accept=".json,application/json" hidden></div>`}
function vRew(){
 let h=`<div class="card"><b>${bal()}pt 보유</b><div class="mut">계획 1개 완료 = 10점 · 주간 80% 달성 = 보너스 30점</div></div><div class="card"><b>갖고 싶은 보상 정하기</b><div class="mut">부모님과 상의해서 정해요</div><input id="rn" maxlength="30" placeholder="예) 주말 게임 1시간"><input id="rc" type="number" min="10" step="10" placeholder="필요한 점수 (예: 100)"><button class="pri" data-a="radd">보상 추가</button></div>`;
 if(!S.rewards.length)h+=`<div class="empty">아직 보상이 없어요</div>`;
 S.rewards.forEach(r=>{h+=`<div class="card row" style="justify-content:space-between"><div><b>${esc(r.n)}</b><div class="mut">${r.c}pt</div></div><div class="row"><button class="pri" ${bal()<r.c?"disabled":""} data-a="rget" data-v="${r.id}">받기</button><button class="sm" data-a="rdel" data-v="${r.id}">✕</button></div></div>`});
 if(S.got.length)h+=`<div class="card"><b>받은 보상</b>${S.got.slice().reverse().map(g=>`<div class="mut">${g.d} · ${esc(g.n)}</div>`).join("")}</div>`;
 return h}
document.getElementById("app").addEventListener("click",ev=>{
 const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,q=id=>document.getElementById(id);
 if(a==="tab")tab=v;
 else if(a==="wk")off+=+v;
 else if(a==="add")adding=v||null;
 else if(a==="save"){const x=q("at").value.trim();if(!x){q("at").focus();return}S.tasks.push({id:Date.now()+"",date:v,g:q("ag").value,x,done:false});adding=null}
 else if(a==="chk"){const t=S.tasks.find(t=>t.id===v),b0=bonus();t.done=!t.done;if(t.done){const nb=bonus()-b0;pop(nb>0?"주간 목표 달성 · 보너스 +"+nb+"pt":"+10pt")}}
 else if(a==="del"){S.tasks=S.tasks.filter(t=>t.id!==v)}
 else if(a==="ge")newG.e=v;else if(a==="gc")newG.c=v;
 else if(a==="gadd"){const n=q("gn").value.trim();if(!n){q("gn").focus();return}S.goals.push({id:Date.now()+"",n,e:newG.e,c:newG.c})}
 else if(a==="gdel"){if(!confirm("이 목표를 삭제할까요? 관련 계획도 함께 지워져요.\n(이미 받은 점수는 줄어들 수 있어요)"))return;S.goals=S.goals.filter(g=>g.id!==v);S.tasks=S.tasks.filter(t=>t.g!==v)}
 else if(a==="radd"){const n=q("rn").value.trim(),c=parseInt(q("rc").value);if(!n||!(c>0))return;S.rewards.push({id:Date.now()+"",n,c})}
 else if(a==="rget"){const r=S.rewards.find(r=>r.id===v);if(bal()<r.c)return;S.spent+=r.c;S.got.push({n:r.n,d:ds(new Date()).slice(5).replace("-","/")});pop("보상 획득 · "+esc(r.n))}
 else if(a==="rdel")S.rewards=S.rewards.filter(r=>r.id!==v);
 else if(a==="exp"){exp();return}
 else if(a==="imp"){q("fi").click();return}
 save();render()});
function exp(){
 const data=JSON.stringify(S),name="weekly-challenge-"+ds(new Date())+".json";
 const url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");
 a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();deferredInstall=ev;const b=document.getElementById("install");if(b)b.style.display="block"});
document.addEventListener("click",async ev=>{if(ev.target.id!=="install"||!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;ev.target.style.display="none"});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
document.addEventListener("change",ev=>{if(!ev.target||ev.target.id!=="fi")return;const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const c=JSON.parse(r.result);if(!Array.isArray(c.goals)||!Array.isArray(c.tasks))throw 0;S=Object.assign({goals:[],tasks:[],rewards:[],spent:0,got:[]},c);await writeState();render();pop("불러오기 완료")}catch(e){pop("올바른 백업 파일이 아니에요")}};r.readAsText(f)});
(async()=>{await readState();render()})();
</script></body></html>
